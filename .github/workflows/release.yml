name: Release

# Pushing a tag v<version> builds the installer and publishes a GitHub release with it.
# The tag must match <Version> in Directory.Build.props: bump that first, merge, then tag main.
#
#   git tag v1.0.100
#   git push origin v1.0.100

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never two releases at once, and never cancel one half-way.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build provenance
      attestations: write  # store the build provenance

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the version
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [xml] $shared = Get-Content Directory.Build.props
          $version = ($shared.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($env:TAG -ne "v$version") {
            throw "Tag $env:TAG does not match <Version>$version</Version> in Directory.Build.props."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build the installer
        shell: pwsh
        run: ./tools/publish.ps1

      - name: Write the checksum
        id: files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $msi = "artifacts/installer/Tsume-$env:VERSION-x64.msi"
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $msi -Leaf)" | Set-Content "$msi.sha256" -NoNewline
          "msi=$msi" >> $env:GITHUB_OUTPUT

      # Anyone can check a download came from this workflow: gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.msi }}

      # Drafted first and published once every file is attached, so it works with immutable releases.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          MSI: ${{ steps.files.outputs.msi }}
        run: |
          gh release create $env:TAG $env:MSI "$env:MSI.sha256" `
            --repo $env:GITHUB_REPOSITORY --verify-tag --draft --generate-notes --title "Tsume $env:TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Creating the release failed.' }
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
